services:
  reactor:
    container_name: reactor-apache
    build:
      context: ./docker
      dockerfile: Dockerfile
    # Puertos FIJOS, interno = externo, mismo dev y prod. Apache escucha en
    # los puertos de ports.conf (no en 80) y rutea por puerto a cada vhost.
    # Si alguno esta ocupado, liberar el otro proceso -- nunca remapear.
    #   8086 -> cloud
    #   8087 -> panel
    #   8115 -> app
    ports:
      - "8086:8086"
      - "8087:8087"
      - "8115:8115"
    volumes:
      - ./cloud:/var/www/html
      - ./panel:/var/www/panel
      - ./app:/var/www/app
      # env.php y los .env quedan en /var/www (un nivel arriba de los docroots)
      # para que `dirname(__DIR__, 2) . '/env.php'` desde cualquier .php de
      # cloud/api/ resuelva correctamente y sean compartibles entre apps.
      - ./env.php:/var/www/env.php:ro
      - ./.env.development:/var/www/.env.development:ro
      - ./.env.production:/var/www/.env.production:ro
    # Las credenciales de DB vienen del archivo .env que se le indique.
    # Por defecto usa .env.development (apunta al MySQL externo de
    # herramientas-mysql via host.docker.internal). Para apuntar a
    # produccion (AWS RDS), levantar con:
    #   ENV_FILE=.env.production docker compose -p reactor up -d
    env_file:
      - ${ENV_FILE:-.env.development}
    restart: unless-stopped

  # En dev el broker MQTT lo provee el stack `herramientas` (contenedor
  # `emqx`, imagen emqx/emqx:latest, puertos default 1883 / 18083). Reactor
  # se conecta via host.docker.internal (ver MQTT_HOST/MQTT_PORT en
  # .env.development). En prod si hay un EMQX dedicado -- ver
  # scripts/aprovisionar_server.sh.

  reactor-motor:
    container_name: reactor-motor
    build:
      context: ./motor
      dockerfile: Dockerfile
    volumes:
      - ./motor:/app
    env_file:
      - ${ENV_FILE:-.env.development}
    restart: unless-stopped
