# Reemplaza el ports.conf default de Debian/Apache.
# Apache escucha en 8086 (cloud) y 8087 (panel). Mismo numero adentro y afuera
# del contenedor (compose lo mapea 1:1) y mismo numero entre dev y prod (en
# prod nginx proxea cada subdominio a su puerto).
#
# Cuando se sumen api/app/www como apps, cada una tomara su propio puerto fijo
# siguiendo el mismo patron (1 Listen + 1 VirtualHost por puerto, mismo numero
# interno/externo, mismo dev/prod).
Listen 8086
Listen 8087
