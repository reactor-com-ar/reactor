# Reemplaza el ports.conf default de Debian/Apache.
# Apache escucha en 8086 (cloud), 8087 (panel), 8115 (app) y 8134 (www). Mismo
# numero adentro y afuera del contenedor (compose lo mapea 1:1) y mismo numero
# entre dev y prod (en prod nginx proxea cada subdominio a su puerto).
#
# El 8134 es el primer puerto libre del stack de contenedores de la maquina de
# desarrollo: 8080-8133 estan todos tomados por los proyectos vecinos (repo,
# reactor, batallercontenidos, radiofundacion, vigicom, databox, sanjuanalmundo,
# causam, dex, vigia, terappia, colebiosanjuan, nexel). Antes de sumar otro
# puerto, chequear con `docker ps --format "{{.Names}}\t{{.Ports}}"`.
#
# Cuando se sume api como app, tomara su propio puerto fijo siguiendo el mismo
# patron (1 Listen + 1 VirtualHost por puerto, mismo numero interno/externo,
# mismo dev/prod).
Listen 8086
Listen 8087
Listen 8115
Listen 8134
