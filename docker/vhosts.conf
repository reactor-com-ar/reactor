# Vhosts del contenedor reactor-apache. La routing es POR PUERTO (no por Host
# header): cada vhost esta atado a un puerto distinto, mismo numero adentro y
# afuera del contenedor, y mismo numero entre dev y prod.
#
#   8086 -> /var/www/html   (cloud)
#   8087 -> /var/www/panel  (panel)
#   8115 -> /var/www/app    (app end-user)
#   8134 -> /var/www/www    (sitio publico)
#
# Dev: http://localhost:8086, http://localhost:8087, http://localhost:8115,
#      http://localhost:8134
# Prod: nginx mapea cloud.reactor.com.ar -> 127.0.0.1:8086,
#       panel.reactor.com.ar -> 127.0.0.1:8087,
#       app.reactor.com.ar   -> 127.0.0.1:8115 (alias pwa/newapp/webapp),
#       www.reactor.com.ar   -> 127.0.0.1:8134 (alias del apex reactor.com.ar).
#       control.reactor.com.ar NO se proxea: nginx lo redirige a panel.
#
# Desde el 2026-09-05 la app end-user vive en app.reactor.com.ar: ese DNS dejo
# de apuntar al server legacy y ahora resuelve aca. pwa.reactor.com.ar era el
# dominio de preview y se conserva como ServerAlias (y en el cert) porque quedo
# en accesos directos; cuando ya no lo use nadie se puede sacar de los dos
# lados, aca y en scripts/aprovisionar_server.sh (PWA_DOMAIN_ALIAS).
# newapp.reactor.com.ar y webapp.reactor.com.ar son alias adicionales del mismo
# vhost. Como la routing es por puerto, los ServerAlias no cambian a que app
# llega el request: sirven para que el vhost se reconozca por nombre (logs,
# redirects, futuras reglas por Host). Para que respondan de verdad en prod hay
# que sumarlos ademas al server_name de nginx y al certificado, en
# scripts/aprovisionar_server.sh.
#
# Los Listen viven en ports.conf (no aca) para no chocar con la inclusion
# automatica que hace Apache.

<VirtualHost *:8086>
    ServerName cloud.reactor.com.ar
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Sin ServerAlias para control.reactor.com.ar: ese dominio NO llega hasta aca.
# nginx lo resuelve con un 301 a panel.reactor.com.ar y nunca lo proxea a
# Apache (ver el bloque de control. en scripts/aprovisionar_server.sh), asi que
# un alias aca seria informacion muerta y enganosa.
<VirtualHost *:8087>
    ServerName panel.reactor.com.ar
    DocumentRoot /var/www/panel
    <Directory /var/www/panel>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8115>
    ServerName app.reactor.com.ar
    ServerAlias pwa.reactor.com.ar
    ServerAlias newapp.reactor.com.ar
    ServerAlias webapp.reactor.com.ar
    DocumentRoot /var/www/app
    <Directory /var/www/app>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Sitio publico de la marca. El apex reactor.com.ar entra al MISMO vhost que
# www. -- no redirige, como si hace control. hacia panel. Por eso va como
# ServerAlias y no como un server block aparte de nginx: son la misma pagina
# servida por dos nombres.
#
# El apex tiene que resolver con un registro A (o ALIAS/ANAME del proveedor):
# los CNAME en el apex los prohibe el RFC 1034 y la mayoria de los DNS los
# rechaza. Los subdominios (www., cloud., panel., app.) no tienen esa
# restriccion.
#
# Igual que con los alias de app y panel, el nombre tiene que estar en los tres
# lugares o no funciona: server_name de nginx, certificado, y este ServerAlias
# (ver WWW_DOMAIN_ALIASES en scripts/aprovisionar_server.sh).
<VirtualHost *:8134>
    ServerName www.reactor.com.ar
    ServerAlias reactor.com.ar
    DocumentRoot /var/www/www
    <Directory /var/www/www>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
