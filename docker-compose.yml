services:
  reactor:
    container_name: reactor-apache
    build:
      context: ./docker
      dockerfile: Dockerfile
    # Puertos FIJOS, interno = externo, mismo dev y prod. Apache escucha en
    # los puertos de ports.conf (no en 80) y rutea por puerto a cada vhost.
    # Si alguno esta ocupado, liberar el otro proceso -- nunca remapear.
    #   8086 -> cloud
    #   8087 -> robot
    ports:
      - "8086:8086"
      - "8087:8087"
    volumes:
      - ./cloud:/var/www/html
      - ./robot:/var/www/robot
      # env.php y los .env quedan en /var/www (un nivel arriba de los docroots)
      # para que `dirname(__DIR__, 2) . '/env.php'` desde cualquier .php de
      # cloud/api/ resuelva correctamente y sean compartibles entre apps.
      - ./env.php:/var/www/env.php:ro
      - ./.env.development:/var/www/.env.development:ro
      - ./.env.production:/var/www/.env.production:ro
    # Las credenciales de DB vienen del archivo .env que se le indique.
    # Por defecto usa .env.development (apunta al MySQL externo de
    # herramientas-mysql via host.docker.internal). Para apuntar a
    # produccion (AWS RDS), levantar con:
    #   ENV_FILE=.env.production docker compose -p reactor up -d
    env_file:
      - ${ENV_FILE:-.env.development}
    restart: unless-stopped

  reactor-emqx:
    container_name: reactor-emqx
    image: emqx/emqx:5.8
    ports:
      # Puertos FIJOS (interno = externo). En dev usamos 1884/18084 para no
      # chocar con vigicom-emqx (1883/18083). En prod son 16273/18083 (ver
      # aprovisionar_server.sh).
      - "1884:1884"     # MQTT dev
      - "18084:18084"   # dashboard dev
    env_file:
      - ${ENV_FILE:-.env.development}
    environment:
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      # Bind interno = externo (override del listener default de EMQX).
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1884"
      EMQX_DASHBOARD__LISTENERS__HTTP__BIND: "0.0.0.0:18084"
    volumes:
      - reactor-emqx-data:/opt/emqx/data
      - ./docker/emqx/init.sh:/init.sh:ro
    entrypoint: ["/init.sh"]
    command: ["/opt/emqx/bin/emqx", "foreground"]
    restart: unless-stopped

  reactor-motor:
    container_name: reactor-motor
    build:
      context: ./motor
      dockerfile: Dockerfile
    volumes:
      - ./motor:/app
    env_file:
      - ${ENV_FILE:-.env.development}
    depends_on:
      reactor-emqx:
        condition: service_started
    restart: unless-stopped

volumes:
  reactor-emqx-data:
